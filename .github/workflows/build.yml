name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastav Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Priprav Gradle wrapper (pevná verzia 8.4)
        run: gradle wrapper --gradle-version 8.4

      - name: Zostav debug APK
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: Nahraj APK ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PushBlok-debug-apk
          path: app/build/outputs/apk/debug/*.apk
